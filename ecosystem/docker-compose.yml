services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecosystem
      POSTGRES_PASSWORD: ecosystem
      POSTGRES_DB: ecosystem
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./scripts/init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecosystem"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build: ./auth-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "4001"
      ECOSYSTEM_DATABASE_URL: postgresql://ecosystem:ecosystem@postgres:5432/ecosystem
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-change-in-production-32chars}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      SUPERADMIN_USERNAMES: ${SUPERADMIN_USERNAMES:-contact_voropaev,ivanvoropaeff}
      TELEGRAM_ALLOW_DEV_LOGIN: ${TELEGRAM_ALLOW_DEV_LOGIN:-true}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGIN: ${PUBLIC_BASE_URL:-http://localhost}

  catalog:
    build: ./services/catalog
    restart: unless-stopped
    environment:
      PORT: "4002"
      CASHER_API_BASE: ${CASHER_API_BASE:-https://api.cashercollection.com}

  media:
    build: ./services/media
    restart: unless-stopped
    volumes:
      - media_data:/data/media
    environment:
      PORT: "4003"
      MEDIA_ROOT: /data/media

  portal:
    build:
      context: ./portal
      args:
        NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME:-}
        NEXT_PUBLIC_TELEGRAM_AUTH_DEV: ${NEXT_PUBLIC_TELEGRAM_AUTH_DEV:-true}
    restart: unless-stopped
    depends_on:
      - auth-service
    environment:
      PORT: "3100"
      AUTH_SERVICE_URL: http://auth-service:4001
      NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME:-}
      NEXT_PUBLIC_TELEGRAM_AUTH_DEV: ${NEXT_PUBLIC_TELEGRAM_AUTH_DEV:-true}

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - portal
      - catalog
      - media
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  # --- Приложения (опционально: docker compose --profile apps up) ---
  production-scheduler:
    profiles: ["apps"]
    build:
      context: ../production-scheduler
    environment:
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-change-in-production-32chars}
      ECOSYSTEM_PUBLIC_URL: ${PUBLIC_BASE_URL:-http://localhost}
      NEXT_PUBLIC_BASE_PATH: /scheduler
      DATABASE_URL: file:/data/app/dev.db
    volumes:
      - scheduler_data:/data/app

  shop-scheduler:
    profiles: ["apps"]
    build:
      context: ../shop_scheduler
    environment:
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-change-in-production-32chars}
      ECOSYSTEM_PUBLIC_URL: ${PUBLIC_BASE_URL:-http://localhost}
      NEXT_PUBLIC_BASE_PATH: /shop
      DATABASE_URL: file:/data/app/shop.db
    volumes:
      - shop_data:/data/app

  drops:
    profiles: ["apps"]
    build:
      context: ../drops/web
    environment:
      DATABASE_URL: postgresql://drops:drops@postgres:5432/drops
      ECOSYSTEM_PUBLIC_URL: ${PUBLIC_BASE_URL:-http://localhost}
      NEXT_PUBLIC_BASE_PATH: /drops
      CATALOG_SERVICE_URL: http://catalog:4002
      MEDIA_SERVICE_URL: http://media:4003
    depends_on:
      - postgres

  bloggers:
    profiles: ["apps"]
    build:
      context: ../bloggers
    environment:
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-change-in-production-32chars}
      ECOSYSTEM_PUBLIC_URL: ${PUBLIC_BASE_URL:-http://localhost}
      NEXT_PUBLIC_BASE_PATH: /bloggers
      DATABASE_URL: file:/data/app/panel.sqlite
      CATALOG_SERVICE_URL: http://catalog:4002
    volumes:
      - bloggers_data:/data/app

volumes:
  pg_data:
  media_data:
  scheduler_data:
  shop_data:
  bloggers_data:
