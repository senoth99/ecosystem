upstream portal { server portal:3100; }
upstream auth { server auth-service:4001; }
upstream catalog { server catalog:4002; }
upstream media { server media:4003; }

server {
  listen 80;
  server_name _;
  client_max_body_size 20m;

  location = / {
    proxy_pass http://portal;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /login {
    proxy_pass http://portal;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
  }

  location /admin {
    proxy_pass http://portal;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
  }

  location /api/eco/ {
    proxy_pass http://auth/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
  }

  location /api/catalog/ {
    rewrite ^/api/catalog/(.*)$ /$1 break;
    proxy_pass http://catalog;
  }

  location /api/media/ {
    rewrite ^/api/media/(.*)$ /$1 break;
    proxy_pass http://media;
  }

  location /_next/ {
    proxy_pass http://portal;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # Apps — uncomment when containers run behind nginx with basePath
  # location /scheduler/ { proxy_pass http://production-scheduler:3000/; }
  # location /shop/ { proxy_pass http://shop-scheduler:3000/; }
  # location /drops/ { proxy_pass http://drops:3000/; }
  # location /bloggers/ { proxy_pass http://bloggers:3000/; }
}
