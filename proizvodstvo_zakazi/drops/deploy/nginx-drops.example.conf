# Пример для nginx на VPS: TLS и прокси на Next.js (./deploy.sh start → порт 3000).
# Замените server_name и пути к сертификатам. После правки: sudo ln -s ... /etc/nginx/sites-enabled/

upstream drops_next {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name drops.cashercollection.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name drops.cashercollection.com;

    # ssl_certificate     /etc/letsencrypt/live/drops.cashercollection.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/drops.cashercollection.com/privkey.pem;

    client_max_body_size 25m;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_pass http://drops_next;
    }
}
